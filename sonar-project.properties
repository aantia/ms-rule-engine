sonar.projectKey=thechandanbhagat_ms-rule-engine
sonar.organization=thechandanbhagat
sonar.projectName=MS Rule Engine - Node.js SDK
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Language-specific properties
sonar.typescript.node=node